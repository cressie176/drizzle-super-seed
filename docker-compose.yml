services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: drizzle_super_seed
      POSTGRES_PASSWORD: drizzle_super_seed
      POSTGRES_DB: drizzle_super_seed
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drizzle_super_seed"]
      interval: 5s
      timeout: 5s
      retries: 5
