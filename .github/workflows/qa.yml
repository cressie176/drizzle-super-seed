name: QA

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_super_seed
          PGPASSWORD: drizzle_super_seed
          PGDATABASE: drizzle_super_seed
          MARIADB_HOST: localhost
          MARIADB_PORT: 3306
          MARIADB_USER: drizzle_super_seed
          MARIADB_PASSWORD: drizzle_super_seed
          MARIADB_DATABASE: drizzle_super_seed

  # Proves the library against drizzle-orm 1.0.0 by swap-installing the pinned pre-release
  # over the baseline, so the library resolves it for everything, exactly as a consuming project
  # on 1.0.0 does. The v1 test file skips itself in the baseline jobs above.
  drizzle-v1:
    name: Drizzle 1.0.0 relations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:drizzle-v1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run coverage
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_super_seed
          PGPASSWORD: drizzle_super_seed
          PGDATABASE: drizzle_super_seed
          MARIADB_HOST: localhost
          MARIADB_PORT: 3306
          MARIADB_USER: drizzle_super_seed
          MARIADB_PASSWORD: drizzle_super_seed
          MARIADB_DATABASE: drizzle_super_seed
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  example:
    name: Worked example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run examples:sinks:typecheck
      - run: npm run examples:sinks:test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_super_seed
          PGPASSWORD: drizzle_super_seed
          PGDATABASE: drizzle_super_seed
          MARIADB_HOST: localhost
          MARIADB_PORT: 3306
          MARIADB_USER: drizzle_super_seed
          MARIADB_PASSWORD: drizzle_super_seed
          MARIADB_DATABASE: drizzle_super_seed
      - run: npm run examples:sinks:image

  # The real-world examples run apart from the park-domain ones (#57): they fetch pinned
  # upstream schemas over the network, pull third-party images, and bake three Postgres images,
  # so a failure here should read as what it is rather than as a broken library. Only the
  # generate step exercises the library's plan resolution against these schemas, which is how
  # an error-contract change once broke AdventureWorks while every cheaper gate stayed green.
  real-world:
    name: Real-world examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run examples:real-world:typecheck
      - run: npm run examples:real-world:test
        env:
          MARIADB_HOST: localhost
          MARIADB_PORT: 3306
          MARIADB_USER: drizzle_super_seed
          MARIADB_PASSWORD: drizzle_super_seed
          MARIADB_DATABASE: drizzle_super_seed
      - run: npm run examples:real-world:image
