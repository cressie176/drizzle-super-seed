name: QA

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_super_seed
          PGPASSWORD: drizzle_super_seed
          PGDATABASE: drizzle_super_seed

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run coverage
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_super_seed
          PGPASSWORD: drizzle_super_seed
          PGDATABASE: drizzle_super_seed
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  example:
    name: Worked example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run example:typecheck
      - run: npm run example:test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_super_seed
          PGPASSWORD: drizzle_super_seed
          PGDATABASE: drizzle_super_seed
      - run: npm run example:image
